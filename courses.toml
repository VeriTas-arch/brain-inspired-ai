[common]
files = ["LICENSE", "biai/__init__.py", "biai/paths.py", "biai/reproducibility.py"]
dependencies = ["ipykernel", "ipython", "numpy", "matplotlib", "torch"]

[datasets.mnist]
title = "MNIST"
source_url = "https://ossci-datasets.s3.amazonaws.com/mnist/"
citation_url = "https://yann.lecun.com/exdb/mnist/"
sources = [
  { path = "MNIST/raw/train-images-idx3-ubyte.gz", md5 = "f68b3c2dcbeaaa9fbdd348bbdeb94873", format = "gzip" },
  { path = "MNIST/raw/train-labels-idx1-ubyte.gz", md5 = "d53e105ee54ea40749a09fcbcd1e9432", format = "gzip" },
  { path = "MNIST/raw/t10k-images-idx3-ubyte.gz", md5 = "9fb629c4189551a2d022fa330f9573f3", format = "gzip" },
  { path = "MNIST/raw/t10k-labels-idx1-ubyte.gz", md5 = "ec29112dd5afa0611ce80d1b7f02629c", format = "gzip" },
]

[datasets.cifar10]
title = "CIFAR-10"
source_url = "https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz"
citation_url = "https://www.cs.toronto.edu/~kriz/cifar.html"
sources = [
  { path = "cifar-10-python.tar.gz", md5 = "c58f30108f718f92721af3b95e74349a", format = "tar-xz" },
]

[datasets.omniglot]
title = "Omniglot"
source_url = "https://github.com/brendenlake/omniglot/raw/master/python/"
citation_url = "https://github.com/brendenlake/omniglot"
sources = [
  { path = "omniglot-py/images_background.zip", md5 = "68d2efa1b9178cc56df9314c21c6e718", format = "zip" },
  { path = "omniglot-py/images_evaluation.zip", md5 = "6b91aef0f799c5bb55b94e3f2daec811", format = "zip" },
]

[lessons.intro]
title = "环境配置与 PyTorch 入门"
files = ["biai/intro/*.py"]
dependencies = []
datasets = []

[lessons.mlp]
title = "多层感知机与学习规则"
files = ["biai/mlp/*.py"]
dependencies = ["torchvision"]
datasets = ["mnist"]

[lessons.cnn]
title = "卷积神经网络与图像分类"
files = ["biai/cnn/*.py"]
dependencies = ["torchvision"]
datasets = ["mnist", "cifar10"]

[lessons.continual_mnist]
title = "MNIST 持续学习"
files = ["biai/continual_mnist/*.py"]
dependencies = ["torchvision"]
datasets = ["mnist"]

[lessons.meta_learning]
title = "少样本学习与 MAML"
files = ["biai/meta_learning/*.py"]
dependencies = ["torchvision", "pillow"]
datasets = ["omniglot"]

[lessons.atari]
title = "Atari 强化学习"
files = ["biai/atari/**/*.py", "assets/README.md", "assets/reference_results.json", "assets/figures/*.png", "assets/figures/*.json", "assets/videos/*.gif", "assets/videos/*.json"]
dependencies = ["ale-py", "gymnasium", "imageio-ffmpeg", "opencv-python", "pillow", "tqdm"]
datasets = []
