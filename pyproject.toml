[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "biai-course"
version = "0.1.0"
description = "Brain-Inspired Artificial Intelligence course notebooks and Python implementations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "ale-py>=0.12.1",
    "gymnasium>=1.3",
    "imageio-ffmpeg>=0.6",
    "ipykernel>=7.3",
    "ipython>=9.17.1",
    "matplotlib>=3.11",
    "nbformat>=5.11.1",
    "notebook>=7.5.0",
    "numpy>=2.5",
    "opencv-python>=5",
    "pillow>=12.3",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "torch>=2.14",
    "torchvision>=0.29",
    "tqdm>=4.70",
]

[tool.setuptools.packages.find]
include = ["biai*"]

[tool.setuptools.package-data]
"*" = ["*.ipynb", "README.md"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
cache_dir = ".cache/pytest"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
