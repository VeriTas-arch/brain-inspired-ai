[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atari-playground"
version = "0.1.0"
description = "Educational Atari reinforcement-learning and continual-learning playground"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "ale-py>=0.12.1",
    "gymnasium[atari]>=1.3",
    "imageio>=2.37",
    "imageio-ffmpeg>=0.6",
    "matplotlib>=3.11",
    "numpy>=2.5",
    "opencv-python>=5",
    "torch>=2.14",
    "torchrl>=0.13.3",
    "tqdm>=4.70",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.setuptools.packages.find]
include = ["algorithms*", "environments*", "utils*"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["Atari_RL_Complete_Tutorial.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
